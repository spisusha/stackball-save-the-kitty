<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stack Ball, превью</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; top: 14px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .bar { display: flex; align-items: center; width: 78%; max-width: 340px; }
  .lvl { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 16px; background: var(--c, #2a9df4); flex: none; }
  .track { flex: 1; height: 10px; background: rgba(255,255,255,.55); margin: 0 -2px; }
  .fill { height: 100%; width: 0%; background: var(--c, #2a9df4); transition: width .08s linear; }
  #score { margin-top: 4px; font-size: 40px; font-weight: 800; color: rgba(255,255,255,.75); text-shadow: 0 2px 0 rgba(0,0,0,.08); }
  #goal { margin-top: 2px; font-size: 13px; font-weight: 800; color: #fff; letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.35); display: none; }
  #fire { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.6); font-size: 44px; font-weight: 900; color: #ff7a00; text-shadow: 0 3px 0 #b33a00, 0 0 24px rgba(255,140,0,.7); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  #fire.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #combo { position: fixed; left: 50%; top: 44%; transform: translateX(-50%); font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .15s; }
  #hint { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 22%; color: #fff; pointer-events: none; transition: opacity .25s; }
  #hint.off { opacity: 0; }
  .hand { width: 72px; height: 72px; position: relative; animation: press 1.1s ease-in-out infinite; }
  @keyframes press { 0%,100% { transform: translateY(0) scale(1); } 45% { transform: translateY(6px) scale(.92); } }
  .ring { width: 70px; height: 70px; border: 4px solid rgba(255,255,255,.85); border-radius: 50%; margin-bottom: -60px; animation: ring 1.1s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(.6); opacity: 0; } 40% { opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
  #hint b { margin-top: 18px; font-size: 22px; font-weight: 900; letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  #help { position: fixed; padding: 6px 10px; background: #fff; color: #d83a2a; font-weight: 900; font-size: 18px; border-radius: 10px; transform: translate(-50%, -100%); pointer-events: none; display: none; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  #help::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
  #end { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.35); color: #fff; text-align: center; }
  #end.show { display: flex; }
  #end h2 { margin: 0 16px 6px; font-size: 38px; font-weight: 900; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  #end p { margin: 0 0 22px; font-size: 18px; font-weight: 700; opacity: .95; }
  #end button { font: inherit; font-weight: 900; font-size: 20px; border: 0; padding: 14px 34px; background: #ffd400; color: #111; border-radius: 12px; box-shadow: 0 4px 0 #b39500; cursor: pointer; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  #modes { position: fixed; right: 8px; bottom: 8px; display: flex; gap: 4px; }
  #modes button { font: inherit; font-size: 12px; font-weight: 700; border: 0; padding: 6px 9px; border-radius: 8px; background: rgba(0,0,0,.35); color: #fff; cursor: pointer; }
  #modes button.on { background: #fff; color: #111; }
</style>
</head>
<body>
<div id="hud">
  <div class="bar"><div class="lvl" id="lvlA">48</div><div class="track"><div class="fill" id="fill"></div></div><div class="lvl" id="lvlB">49</div></div>
  <div id="score">0</div>
  <div id="goal">Спаси котика</div>
</div>
<div id="combo"></div>
<div id="fire">ОГОНЬ!</div>
<div id="help">HELP!</div>
<div id="hint">
  <div class="ring"></div>
  <svg class="hand" viewBox="0 0 64 64" fill="#fff"><path d="M24 30V10a5 5 0 0 1 10 0v16l3-1a5 5 0 0 1 6 2l1 1 3-1a5 5 0 0 1 6 3l1 2 1 0a5 5 0 0 1 6 5l-2 14c-1 6-6 11-12 11H33c-3 0-6-2-8-4L13 44a5 5 0 0 1 7-7z"/></svg>
  <b>ДЕРЖИ, ЧТОБЫ РАЗБИТЬ</b>
</div>
<div id="end"><h2 id="endTitle"></h2><p id="endText"></p><button id="endBtn">Ещё раз</button></div>
<div id="modes"><button data-m="classic">Классика</button><button data-m="rescue">Спасение</button></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// Settings
const SEG = 8, RI = 0.62, RO = 2.0, H = 0.26, GAP = 0.42;
const BALL_R = 0.27, BALL_Z = 1.3;
const G = -32, BOUNCE = 7.6, SMASH = -4.4;
const FIRE_AT = 15, FIRE_TIME = 2.4, INTRO = 1.6;
const LEVELS = [
  { ring: '#ffd400', bgTop: '#7a3cb8', bgBot: '#ff6a3d' },
  { ring: '#3ad16b', bgTop: '#1fb5c9', bgBot: '#9be15d' },
  { ring: '#2a9df4', bgTop: '#ff8a65', bgBot: '#ffd36e' },
  { ring: '#ff4d6d', bgTop: '#2f80ed', bgBot: '#56ccf2' },
];
const BLACK = '#1d1d22';

const params = new URLSearchParams(location.search);
let mode = params.get('mode') === 'rescue' ? 'rescue' : 'classic';
if (params.get('embed')) document.getElementById('modes').style.display = 'none';

// Renderer and scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(4, 8, 6);
scene.add(sun);

function gradientTex(top, bot) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(1, bot); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function checkerTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { g.fillStyle = (x + y) % 2 ? '#111' : '#fff'; g.fillRect(x * 32, y * 32, 32, 32); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// One geometry per ring segment, shared by all rings
const segGeos = [];
for (let s = 0; s < SEG; s++) {
  const a0 = s * Math.PI * 2 / SEG + 0.025, a1 = (s + 1) * Math.PI * 2 / SEG - 0.025;
  const sh = new THREE.Shape();
  sh.absarc(0, 0, RO, a0, a1, false);
  sh.absarc(0, 0, RI, a1, a0, true);
  sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: H, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.035, bevelSegments: 2, curveSegments: 5 });
  g.rotateX(-Math.PI / 2);
  segGeos.push(g);
}
const matCache = {};
const mat = (hex, opts = {}) => (matCache[hex + JSON.stringify(opts)] ||= new THREE.MeshStandardMaterial({ color: hex, roughness: 0.45, metalness: 0.05, ...opts }));

// Voxel crumbs: one instanced mesh, reused pool
const MAXP = 1600;
const crumbs = new THREE.InstancedMesh(new THREE.BoxGeometry(0.13, 0.13, 0.13), new THREE.MeshStandardMaterial({ roughness: 0.6 }), MAXP);
crumbs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(crumbs);
const P = Array.from({ length: MAXP }, () => ({ life: 0, p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), s: 1 }));
let pHead = 0;
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3(), tmpC = new THREE.Color();
for (let i = 0; i < MAXP; i++) crumbs.setColorAt(i, tmpC.set('#fff'));
function burst(pos, colorHex, n, power = 1) {
  tmpC.set(colorHex);
  for (let i = 0; i < n; i++) {
    const idx = pHead = (pHead + 1) % MAXP; const q = P[idx];
    q.life = 0.7 + Math.random() * 0.6; q.s = 0.6 + Math.random() * 0.9;
    q.p.copy(pos).add(new THREE.Vector3((Math.random() - .5) * .5, (Math.random() - .5) * .2, (Math.random() - .5) * .5));
    const out = new THREE.Vector3(q.p.x, 0, q.p.z).normalize();
    q.v.set(out.x * (2 + Math.random() * 4) * power, (1 + Math.random() * 4) * power, out.z * (2 + Math.random() * 4) * power);
    q.r.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    crumbs.setColorAt(idx, tmpC);
  }
  crumbs.instanceColor.needsUpdate = true;
}

// World state
let tower, base, lid, cage, cat, rings = [], flying = [];
let level = 0, N = 30, k = 0, score = 0, holding = false, started = false, alive = true, won = false;
let vy = 0, chain = 0, fireT = 0, lidY = 0, introT = 0, camY = 0, idleT = 0, hintShown = true;

const ringTop = i => -i * GAP + H;
const baseY = () => -N * GAP - 0.05;

const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 32, 24), new THREE.MeshStandardMaterial({ color: '#2a7fff', roughness: 0.25, metalness: 0.1, emissive: '#000' }));
scene.add(ball);
const trail = [];
for (let i = 0; i < 14; i++) {
  const t = new THREE.Mesh(new THREE.SphereGeometry(BALL_R * (1 - i / 16), 16, 12), new THREE.MeshBasicMaterial({ color: '#7fb6ff', transparent: true, opacity: 0.35 * (1 - i / 14), depthWrite: false }));
  scene.add(t); trail.push(t);
}
const history = [];

function buildLevel() {
  if (tower) scene.remove(tower);
  [base, lid, cage, cat].forEach(o => o && scene.remove(o));
  lid = cage = cat = null;
  const L = LEVELS[level % LEVELS.length];
  scene.background = gradientTex(L.bgTop, L.bgBot);
  N = mode === 'rescue' ? 34 : 30;
  tower = new THREE.Group(); scene.add(tower);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.56, N * GAP + 8, 32), mat('#ffffff', { roughness: 0.3 }));
  pole.position.y = -N * GAP / 2 + 3; tower.add(pole);
  rings = [];
  for (let i = 0; i < N; i++) {
    const g = new THREE.Group(); g.position.y = -i * GAP; g.rotation.y = i * 0.14; // slight spiral like the original
    const black = new Array(SEG).fill(false);
    if (i >= 5 && i < N - 1 && Math.random() < 0.62) {
      const start = Math.floor(Math.random() * SEG), len = 2 + (Math.random() < 0.35 ? 1 : 0);
      for (let j = 0; j < len; j++) black[(start + j) % SEG] = true;
    }
    const segs = [];
    for (let s = 0; s < SEG; s++) {
      const m = new THREE.Mesh(segGeos[s], mat(black[s] ? BLACK : L.ring, black[s] ? { roughness: 0.25 } : {}));
      m.userData = { s, black: black[s] }; g.add(m); segs.push(m);
    }
    tower.add(g); rings.push({ g, segs, black });
  }
  const baseR = mode === 'rescue' ? 3.4 : 2.3;
  base = new THREE.Mesh(new THREE.CylinderGeometry(baseR, baseR, 0.3, 48), [mat('#ffffff'), new THREE.MeshStandardMaterial({ map: checkerTex(), roughness: 0.5 }), mat('#ffffff')]);
  base.position.y = baseY() - 0.15; scene.add(base);
  if (mode === 'rescue') buildRescue();

  k = 0; score = 0; chain = 0; fireT = 0; vy = 0; alive = true; won = false; started = false; idleT = 0; holding = false;
  ball.position.set(0, ringTop(0) + BALL_R + 0.9, BALL_Z);
  ball.visible = true; ball.material.color.set('#2a7fff'); ball.material.emissive.set('#000');
  fireEl.classList.remove('on');
  introT = mode === 'rescue' ? 0 : 99;
  camY = mode === 'rescue' ? baseY() + 1.6 : ball.position.y;
  document.documentElement.style.setProperty('--c', L.ring === '#ffd400' ? '#f2a900' : L.ring);
  lvlA.textContent = 48 + level; lvlB.textContent = 49 + level;
  goal.style.display = mode === 'rescue' ? 'block' : 'none';
  setHint(true); updateHud();
}

function buildRescue() {
  // Cage with a cat on the base, and a spiked lid coming down from the top
  cage = new THREE.Group(); cat = new THREE.Group();
  const cx = 0.2, cz = 2.75, y0 = baseY();
  const orange = mat('#ff9a3c'), cream = mat('#fff3e0'), dark = mat('#222');
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 16), orange); body.scale.set(1, .85, 1.1); body.position.y = 0.3;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 20, 16), orange); head.position.set(0, 0.72, 0.12);
  const earL = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.18, 12), orange); earL.position.set(-0.13, 0.95, 0.1);
  const earR = earL.clone(); earR.position.x = 0.13;
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), cream); muzzle.position.set(0, 0.66, 0.33); muzzle.scale.set(1.3, .8, .7);
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.038, 10, 8), dark); eyeL.position.set(-0.09, 0.77, 0.34);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.09;
  const tail = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.05, 8, 16, Math.PI), orange); tail.position.set(0.25, 0.35, -0.25); tail.rotation.y = 1.2;
  cat.add(body, head, earL, earR, muzzle, eyeL, eyeR, tail);
  cat.position.set(cx, y0, cz); scene.add(cat);
  const barM = mat('#8a8f98', { metalness: 0.6, roughness: 0.3 });
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.25, 6), barM);
    bar.position.set(Math.cos(a) * 0.55, 0.62, Math.sin(a) * 0.55); bar.userData.a = a; cage.add(bar);
  }
  const top = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.05, 8, 32), barM); top.rotation.x = Math.PI / 2; top.position.y = 1.25; cage.add(top);
  cage.position.set(cx, y0, cz); scene.add(cage);
  lid = new THREE.Group();
  lid.add(new THREE.Mesh(new THREE.CylinderGeometry(2.25, 2.25, 0.35, 40), mat('#3a3f4a', { metalness: 0.5, roughness: 0.35 })));
  const spikeM = mat('#c9ced6', { metalness: 0.8, roughness: 0.2 });
  for (let r = 0; r < 2; r++) for (let i = 0; i < (r ? 14 : 7); i++) {
    const a = i / (r ? 14 : 7) * Math.PI * 2 + r * 0.2, rad = r ? 1.7 : 1.05;
    const sp = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.5, 10), spikeM);
    sp.rotation.x = Math.PI; sp.position.set(Math.cos(a) * rad, -0.42, Math.sin(a) * rad); lid.add(sp);
  }
  lidY = ringTop(0) + 4.4; lid.position.y = lidY; scene.add(lid);
}

// UI helpers
const fill = document.getElementById('fill'), scoreEl = document.getElementById('score');
const fireEl = document.getElementById('fire'), comboEl = document.getElementById('combo');
const hint = document.getElementById('hint'), help = document.getElementById('help');
const lvlA = document.getElementById('lvlA'), lvlB = document.getElementById('lvlB'), goal = document.getElementById('goal');
const endEl = document.getElementById('end'), endTitle = document.getElementById('endTitle'), endText = document.getElementById('endText');
function updateHud() { fill.style.width = (k / N * 100).toFixed(1) + '%'; scoreEl.textContent = score; }
function setHint(on) { hintShown = on; hint.classList.toggle('off', !on); }
let comboTimer = 0;
function showCombo(txt) { comboEl.textContent = txt; comboEl.style.opacity = 1; comboTimer = 0.5; }
function showEnd(title, text) { endTitle.textContent = title; endText.textContent = text; endEl.classList.add('show'); }

function segmentUnderBall(ring) {
  const wy = ring.g.getWorldPosition(new THREE.Vector3()).y;
  const v = ring.g.worldToLocal(new THREE.Vector3(0, wy, BALL_Z));
  let a = Math.atan2(-v.z, v.x); if (a < 0) a += Math.PI * 2;
  return Math.floor(a / (Math.PI * 2 / SEG)) % SEG;
}
function breakRing(i) {
  const r = rings[i]; const L = LEVELS[level % LEVELS.length];
  r.g.updateMatrixWorld(true);
  r.segs.forEach(m => {
    const ang = (m.userData.s + 0.5) * Math.PI * 2 / SEG;
    const world = new THREE.Vector3(Math.cos(ang) * 1.3, 0.1, -Math.sin(ang) * 1.3).applyMatrix4(r.g.matrixWorld);
    scene.attach(m);
    const out = new THREE.Vector3(world.x, 0, world.z).normalize();
    flying.push({ m, v: new THREE.Vector3(out.x * (7 + Math.random() * 3), 2 + Math.random() * 3, out.z * (7 + Math.random() * 3)), w: new THREE.Vector3(Math.random() * 10 - 5, Math.random() * 10 - 5, Math.random() * 10 - 5), t: 0.5 });
    burst(world, m.userData.black ? BLACK : L.ring, 9);
  });
  tower.remove(r.g);
}
function shatterBall(title, text) {
  alive = false; ball.visible = false; fireEl.classList.remove('on');
  burst(ball.position.clone(), '#2a7fff', 70, 1.2);
  setTimeout(() => showEnd(title, text), 650);
}
function win() {
  won = true;
  for (let i = 0; i < 6; i++) setTimeout(() => burst(new THREE.Vector3((Math.random() - .5) * 3, baseY() + 1, (Math.random() - .5) * 2 + 1), LEVELS[(level + i) % LEVELS.length].ring, 40, 1.3), i * 120);
  if (mode === 'rescue') {
    cage.children.forEach(b => { if (b.userData.a !== undefined) flying.push({ m: b, v: new THREE.Vector3(Math.cos(b.userData.a) * 4, 3, Math.sin(b.userData.a) * 4), w: new THREE.Vector3(3, 1, 2), t: 1.2 }); });
    setTimeout(() => showEnd('Котик спасён!', 'Ещё 1000 уровней ждут в игре'), 1400);
  } else {
    setTimeout(() => showEnd('Уровень ' + (48 + level) + ' пройден!', 'Счёт: ' + score), 1200);
  }
}

// Input: hold anywhere to smash
addEventListener('pointerdown', e => {
  if (endEl.classList.contains('show') || (e.target.closest && e.target.closest('#modes'))) return;
  holding = true; started = true; setHint(false); idleT = 0;
});
const release = () => { holding = false; if (fireT <= 0) chain = 0; };
addEventListener('pointerup', release); addEventListener('pointercancel', release);
document.getElementById('endBtn').onclick = e => {
  e.stopPropagation(); endEl.classList.remove('show');
  if (won) level++;
  flying.forEach(f => f.m.parent && f.m.parent.remove(f.m)); flying = [];
  buildLevel();
};
document.querySelectorAll('#modes button').forEach(b => {
  b.classList.toggle('on', b.dataset.m === mode);
  b.onclick = e => {
    e.stopPropagation(); mode = b.dataset.m; level = 0; endEl.classList.remove('show');
    document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x === b));
    buildLevel();
  };
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.fov = w / h > 0.9 ? 40 : 56; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
buildLevel();

const clock = new THREE.Clock();
const ONE = new THREE.Vector3(1, 1, 1);
function update(dt) {
  introT += dt;
  const inIntro = mode === 'rescue' && introT < INTRO;
  tower.rotation.y += dt * 1.55;

  // Ball: falls fast while held, bounces when released
  if (alive && !won) {
    if (holding && !inIntro) vy = SMASH; else vy += G * dt;
    ball.position.y += vy * dt;
    while (k < N && ball.position.y - BALL_R <= ringTop(k)) {
      const r = rings[k];
      if ((holding && !inIntro) || fireT > 0) {
        const s = segmentUnderBall(r);
        if (r.black[s] && fireT <= 0) {
          ball.position.y = ringTop(k) + BALL_R;
          shatterBall('Так близко!', 'Пройдено ' + Math.round(k / N * 100) + '%');
          break;
        }
        breakRing(k); k++; chain++; score += fireT > 0 ? 20 : 10;
        if (chain > 2 && chain % 3 === 0 && fireT <= 0) showCombo('x' + chain);
        if (chain >= FIRE_AT && fireT <= 0) { fireT = FIRE_TIME; fireEl.classList.add('on'); }
        updateHud();
      } else {
        ball.position.y = ringTop(k) + BALL_R; vy = BOUNCE;
        ball.scale.set(1.18, 0.82, 1.18);
        burst(new THREE.Vector3(0, ringTop(k) + 0.02, BALL_Z), '#7fb6ff', 3, 0.35);
        break;
      }
    }
    if (alive && !won && k >= N && ball.position.y - BALL_R <= baseY()) { ball.position.y = baseY() + BALL_R; vy = 0; win(); }
  }
  ball.scale.lerp(ONE, 0.2);

  // Fire mode: invincible for a moment after a long chain
  if (fireT > 0) {
    fireT -= dt; ball.material.color.set('#ff7a00'); ball.material.emissive.set('#ff3d00');
    if (Math.random() < 0.6) burst(ball.position.clone().add(new THREE.Vector3(0, 0.2, 0)), Math.random() < .5 ? '#ffb000' : '#ff4d00', 2, 0.4);
    if (fireT <= 0) { fireEl.classList.remove('on'); chain = 0; ball.material.color.set('#2a7fff'); ball.material.emissive.set('#000'); }
  }

  // Trail behind the ball while smashing
  history.unshift(ball.position.clone()); if (history.length > 40) history.pop();
  const trailColor = fireT > 0 ? '#ff9a3c' : '#7fb6ff';
  trail.forEach((t, i) => {
    t.position.copy(history[Math.min(i * 2, history.length - 1)]);
    t.visible = ball.visible && (holding || fireT > 0) && i > 0;
    t.material.color.set(trailColor);
  });

  // Flying ring pieces
  flying = flying.filter(f => {
    f.t -= dt; f.v.y += G * 0.35 * dt; f.m.position.addScaledVector(f.v, dt);
    f.m.rotation.x += f.w.x * dt; f.m.rotation.y += f.w.y * dt; f.m.rotation.z += f.w.z * dt;
    if (f.t < 0.35) f.m.scale.multiplyScalar(0.84);
    if (f.t <= 0) { f.m.parent && f.m.parent.remove(f.m); return false; }
    return true;
  });

  // Crumbs
  for (let i = 0; i < MAXP; i++) {
    const q = P[i];
    if (q.life > 0) {
      q.life -= dt; q.v.y += G * 0.45 * dt; q.p.addScaledVector(q.v, dt); q.r.x += dt * 5; q.r.y += dt * 4;
      tmpQ.setFromEuler(q.r); const s = Math.max(0, Math.min(1, q.life * 2)) * q.s; tmpS.set(s, s, s);
      tmpM.compose(q.p, tmpQ, tmpS);
    } else tmpM.makeScale(0, 0, 0);
    crumbs.setMatrixAt(i, tmpM);
  }
  crumbs.instanceMatrix.needsUpdate = true;

  // Rescue mode: lid comes down, cat waits in the cage
  if (mode === 'rescue' && lid) {
    if (started && alive && !won && !inIntro) {
      lidY -= dt * 1.0; lid.position.y = lidY;
      if (lidY - 0.65 <= ball.position.y + BALL_R) shatterBall('Шипы догнали!', 'Котик всё ещё ждёт внизу');
    }
    cat.position.y = baseY() + (won ? Math.abs(Math.sin(introT * 8)) * 0.4 : Math.abs(Math.sin(introT * 3)) * 0.05);
    cat.rotation.y = won ? introT * 3 : Math.sin(introT * 2) * 0.25;
    const sp = cage.position.clone(); sp.y += 1.6; sp.project(camera);
    const vis = sp.z < 1 && sp.y > -1 && sp.y < 0.9 && !won;
    help.style.display = vis ? 'block' : 'none';
    if (vis) { help.style.left = ((sp.x + 1) / 2 * innerWidth) + 'px'; help.style.top = ((1 - sp.y) / 2 * innerHeight) + 'px'; }
  } else help.style.display = 'none';

  // Camera: rescue mode starts by showing the cat, then flies up to the ball
  const targetY = inIntro ? baseY() + 1.6 : ball.position.y;
  camY += (targetY - camY) * (mode === 'rescue' && introT < INTRO + 0.8 ? 0.06 : 0.15);
  camera.position.set(0, camY + 6.2, 8.6);
  camera.lookAt(0, camY - 1.6, 0);

  // Hint comes back after 5 seconds without touching
  if (started && !holding && alive && !won) { idleT += dt; if (idleT > 5 && !hintShown) setHint(true); }
  hint.classList.toggle('off', !hintShown || inIntro || won || !alive);

  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) comboEl.style.opacity = 0; }
}
function tick() {
  update(Math.min(clock.getDelta(), 0.033));
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
// Debug helper: run the game for N seconds at 60 fps, even when the tab is in background
window.__sim = (secs, hold) => {
  if (hold !== undefined) holding = hold;
  if (hold) { started = true; setHint(false); }
  for (let i = 0; i < secs * 60; i++) update(1 / 60);
  renderer.render(scene, camera);
  return { k, N, score, alive, won, fire: fireT > 0 };
};
window.__danger = () => k < N && rings[k].black[segmentUnderBall(rings[k])] && fireT <= 0;
</script>
